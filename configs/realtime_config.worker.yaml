# Realtime multi-Jetson pipeline configuration

network:
  # Documentation-only address. Override PRIME_URL on every deployed device.
  prime_url: "ws://192.0.2.10:8765"
  prime_bind_host: "0.0.0.0"
  prime_port: 8765
  ingest_path: "/ws/ingest"
  viewer_path: "/ws/view"

worker:
  # Override per Jetson with --camera-id and --source.
  camera_id: "cam2"
  source: 0
  target_fps: 10
  capture_width: 640
  capture_height: 480
  capture_fps: 10
  frame_jpeg_quality: 70
  crop_jpeg_quality: 85
  reconnect_seconds: 3
  print_every_frames: 100

prime:
  output_dir: "outputs/realtime"
  save_video: true
  output_fps: 15
  recording_segment_seconds: 900
  recording_min_free_gb: 5
  recording_disk_check_seconds: 10
  viewer_jpeg_quality: 75
  viewer_send_timeout_seconds: 0.2
  camera_offline_seconds: 5.0
  reid_batch_size: 16
  max_queue_size: 16
  client_max_size_mb: 32

  # Cross-camera global ID gallery. Lower threshold is stricter.
  # Factory uniforms make appearance distances tight; lenient values over-merge.
  global_match_threshold: 0.3
  gallery_ttl_seconds: 300
  gallery_ema_alpha: 0.8
  gallery_max_exemplars: 8
  gallery_use_exemplars_for_matching: true
  debug_reid: true
  save_debug_crops: true
  debug_crop_interval_frames: 10
  filter_edge_false_positives: true
  edge_filter_margin_ratio: 0.025
  edge_filter_max_width_ratio: 0.22
  edge_filter_min_height_ratio: 0.45
  new_identity_min_frames: 5
  new_identity_min_seconds: 0.4
  new_identity_ambiguous_wait_seconds: 2.0
  new_identity_ambiguous_distance: 0.45
  duplicate_local_track_iou_threshold: 0.85
  same_camera_conflict_min_frames: 3
  same_camera_conflict_min_seconds: 0.2
  same_camera_conflict_max_iou: 0.2
  same_camera_conflict_max_gap_seconds: 0.5
  same_camera_conflict_ttl_seconds: 300
  pending_overlap_link_threshold: 0.22
  pending_overlap_link_active_seconds: 0.5
  overlap_lightness_fallback_enabled: true
  overlap_lightness_min_seconds: 2.0
  overlap_lightness_min_edge_frames: 5
  overlap_lightness_min_covisible_seconds: 1.0
  overlap_lightness_max_embedding_distance: 0.5
  overlap_lightness_max_distance: 0.12
  overlap_lightness_match_margin: 0.04
  overlap_lightness_score_weight: 1.0
  identity_lightness_ema_alpha: 0.8
  pending_identity_ttl_seconds: 2.0
  recheck_existing_tracks: true
  existing_track_recheck_threshold: 0.55
  existing_track_remap_margin: 0.08
  existing_track_remap_require_interior: true
  existing_track_max_distance: 0.45
  identity_update_max_distance: 0.35
  split_existing_track_on_drift: false
  allow_all_camera_overlap: false
  overlapping_camera_pairs: []
  adjacent_camera_pairs: []
  new_track_match_threshold: 0.3
  new_track_match_margin: 0.08
  new_track_single_candidate_threshold: 0.16
  overlap_new_track_match_threshold: 0.35
  overlap_new_track_match_margin: 0.04
  overlap_candidate_active_seconds: 1.0
  overlap_new_track_min_seconds: 0.4
  adjacent_new_track_match_threshold: 0.3
  adjacent_new_track_match_margin: 0.05
  adjacent_candidate_max_seconds: 5.0
  adjacent_camera_exclusion_seconds: 0.25
  identity_min_confidence: 0.55
  identity_min_height_ratio: 0.10
  identity_min_area_ratio: 0.0015
  identity_edge_margin_ratio: 0.01
  identity_edge_min_confidence: 0.65
  new_identity_require_interior: true

control:
  worker:
    bind_host: "0.0.0.0"
    port: 8787
    auto_scan: true
    start_on_launch: true
    auto_start_retry_seconds: 5
    sources: []
    camera_ids: ["cam2"]
  worker_nodes:
    - name: "prime-jetson"
      url: "http://192.0.2.10:8787"
    - name: "worker-jetson"
      url: "http://192.0.2.11:8787"

deployment:
  cameras:
    - camera_id: "cam1"
      jetson: "prime-jetson"
      source: "auto"
    - camera_id: "cam2"
      jetson: "worker-jetson"
      source: "auto"
