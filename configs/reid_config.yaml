# TAO ReID Model Configuration with Triton Inference Server

triton:
  server_url: "localhost:8100"  # HTTP endpoint
  model_name: "lttc_reid"
  model_version: "1"
  protocol: "http"  # or "grpc" on port 8101

model:
  onnx_path: "models/lttc_0.1.4.49.onnx"
  engine_path: "triton_models/lttc_reid/1/model.plan"
  input_shape: [384, 192]  # Height x Width (actual ONNX model size)
  embedding_dim: 256

preprocessing:
  # ImageNet normalization stats
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

  # Input format expectations
  color_space: "RGB"  # TAO models expect RGB
  channel_order: "CHW"  # Channels-Height-Width

tensorrt:
  min_batch: 1
  opt_batch: 8
  max_batch: 16
  precision: "fp16"  # FP16 for Blackwell GPU
  workspace_mb: 2048

# Performance settings
inference:
  max_retry: 3
  timeout_ms: 5000
