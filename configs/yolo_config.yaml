# YOLO Person Detection Configuration

model:
  path: "yolo26m.pt"
  device: "cuda:0"

detection:
  conf_threshold: 0.50  # Reject low-confidence false-positive person detections
  iou_threshold: 0.7   # NMS IoU threshold
  classes: [0]  # COCO person class only
  imgsz: 640

# Performance settings
inference:
  half: true
  augment: false
  agnostic_nms: false
  max_det: 50
