# YOLOE-26 Open-Vocabulary Detection Configuration
# Text prompts are embedded once via CLIP — zero extra cost at inference time

model:
  path: "models/yoloe-26x-seg.pt"
  device: "cuda:0"
  # YOLOE uses CLIP to classify each detected box with the configured labels.
  text_prompts: ["person"]

detection:
  conf_threshold: 0.4   # slightly lower than yolo11n — YOLOE is more conservative
  iou_threshold: 0.7
  imgsz: 640

inference:
  half: false  # FP16 disabled: YOLOE-seg has a mask dtype mismatch in half precision
  max_det: 300
